<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#1e6e4a">
<title>Juz Amma – Auswendig Lernen</title>
<link rel="manifest" href="juz-amma-manifest.json">
<style>

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--g:#1e6e4a;--g2:#40b37a;--nv:#1a3a6b;--gd:#ffd60a;--og:#fb8500;--rd:#e63946;--bg:#f0f7ff;--txt:#1a2840;--dim:#5a6e8a;--brd:rgba(26,40,64,.1)}
html,body{height:100%;overflow:hidden;background:var(--bg);font-family:'Segoe UI',Tahoma,sans-serif;color:var(--txt)}

/* ── HEADER ── */
.hdr{position:fixed;top:0;left:0;right:0;z-index:50;background:linear-gradient(135deg,var(--g),var(--nv));padding:10px 16px;display:flex;align-items:center;gap:10px;height:56px}
.user-btn{width:42px;height:42px;border-radius:13px;border:none;background:rgba(255,255,255,.18);color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.user-btn.logged{background:rgba(255,215,10,.3)}
.stars-badge{position:relative;width:42px;height:42px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:30px}
.stars-badge::before{content:'★';color:var(--gd)}
.stars-badge span{position:absolute;top:46%;left:50%;transform:translate(-50%,-50%);font-size:13px;font-weight:900;color:var(--nv)}
.hdr-mid{flex:1;text-align:center}
.hdr-title{color:#fff;font-weight:900;font-size:18px;line-height:1.1}
.hdr-title-ar{color:rgba(255,255,255,.75);font-family:serif;font-size:13px;direction:rtl;text-align:center}

/* ── MAIN ── */
.main{position:fixed;top:56px;bottom:0;left:0;right:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
#totalProg{padding:14px 16px 8px;text-align:center;font-size:14px;font-weight:700;color:var(--dim)}

/* ── SURAH GRID ── */
#surahGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:8px 14px 100px}
.surah-card{background:#fff;border-radius:20px;padding:16px 14px;cursor:pointer;box-shadow:0 2px 12px rgba(26,40,64,.08);border:2px solid transparent;transition:.15s}
.surah-card:active{transform:scale(.97)}
.surah-card.done{border-color:var(--gd);background:linear-gradient(135deg,#fffef0,#fff)}
.sc-num{font-size:11px;font-weight:700;color:var(--dim);margin-bottom:4px}
.sc-ar{font-family:serif;font-size:18px;color:var(--g);direction:rtl;margin-bottom:2px;font-weight:700}
.sc-de{font-size:12px;font-weight:700;color:var(--txt)}
.sc-count{font-size:11px;color:var(--dim);margin-top:2px}
.sc-stars{margin-top:8px;display:flex;gap:2px}
.sc-star{font-size:14px;opacity:.25;filter:grayscale(1)}
.sc-star.lit{opacity:1;filter:none}

/* ── SURAH VIEW ── */
.sv{position:fixed;inset:0;background:var(--bg);z-index:100;overflow-y:auto;display:none}
.sv.open{display:block}
.sv-hdr{background:linear-gradient(135deg,var(--g),var(--nv));padding:50px 16px 14px;position:sticky;top:0;z-index:10}
#backBtn{position:absolute;top:10px;left:12px;width:44px;height:44px;background:rgba(255,255,255,.15);border:none;border-radius:12px;color:#fff;font-size:22px;cursor:pointer}
#svAr{font-family:serif;font-size:24px;color:#fff;text-align:center;direction:rtl;font-weight:700;margin-top:6px}
#svDe{font-size:15px;color:rgba(255,255,255,.8);text-align:center;margin-top:2px}
.sv-prog-row{display:flex;align-items:center;gap:10px;padding:8px 0 0}
#svProg{font-size:12px;color:rgba(255,255,255,.7);font-weight:700;flex-shrink:0}
.sv-pb{flex:1;height:6px;background:rgba(255,255,255,.2);border-radius:4px;overflow:hidden}
#svFill{height:100%;background:var(--gd);border-radius:4px;transition:.5s}
#svStars{font-size:22px;flex-shrink:0}

/* ── CONTROLS ── */
.ctrl{display:flex;align-items:center;gap:8px;padding:10px 14px;background:rgba(255,255,255,.08);border-top:1px solid rgba(255,255,255,.12);flex-wrap:wrap}
.ctrl-btn{height:38px;padding:0 14px;border-radius:12px;border:none;cursor:pointer;font-size:14px;font-weight:700;font-family:inherit;background:rgba(255,255,255,.2);color:#fff}
.ctrl-btn#playBtn{background:var(--gd);color:var(--nv);min-width:54px}
.range-row{display:flex;align-items:center;gap:6px;color:rgba(255,255,255,.8);font-size:13px;font-weight:700;flex-wrap:wrap}
.range-row input{width:46px;padding:5px 8px;border-radius:8px;border:none;background:rgba(255,255,255,.2);color:#fff;font-weight:700;font-size:14px;text-align:center}
#markCount{margin-left:auto;font-size:12px;color:rgba(255,255,255,.7);font-weight:700;flex-shrink:0}

/* ── SURAH DONE BTN ── */
.surah-done-btn{display:block;margin:12px 14px 4px;width:calc(100% - 28px);padding:14px;border-radius:16px;border:none;cursor:pointer;font-size:16px;font-weight:800;font-family:inherit;background:linear-gradient(135deg,var(--g2),var(--g));color:#fff}
.surah-done-btn.done{background:linear-gradient(135deg,var(--gd),var(--og));color:#7c4f00}

/* ── VERSE CARDS ── */
#versesList{padding:8px 14px 100px}
.vc{background:#fff;border-radius:16px;margin-bottom:10px;padding:14px;box-shadow:0 2px 10px rgba(26,40,64,.07);cursor:pointer;border:2px solid transparent;transition:.15s}
.vc.learned{border-color:var(--gd);background:#fffef8}
.vc.marked{border-color:var(--g2)}
.vc.playing{border-color:var(--g);box-shadow:0 0 0 3px rgba(30,110,74,.15)}
.vc-top{display:flex;gap:10px;align-items:flex-start}
.vc-n{font-size:11px;font-weight:700;color:var(--dim);min-width:24px;margin-top:4px}
.vc-ar{font-family:serif;font-size:22px;color:var(--txt);direction:rtl;line-height:1.7;text-align:right;flex:1}
.vc-tr{font-size:13px;color:var(--dim);margin-top:8px;font-style:italic;line-height:1.5}
.vc-de{font-size:13px;color:var(--dim);margin-top:6px;line-height:1.5}
.vc-bot{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;align-items:center}
.vbtn{height:34px;padding:0 12px;border-radius:10px;border:none;cursor:pointer;font-size:13px;font-weight:700;font-family:inherit;background:rgba(26,40,64,.07);color:var(--txt);transition:.15s}
.vbtn:active{transform:scale(.95)}
.v-play{background:var(--g);color:#fff}
.v-mark{background:rgba(26,40,64,.07);color:var(--dim)}
.v-mark.marked{background:var(--g2);color:#fff}
.v-ri{font-size:12px;color:var(--dim);font-weight:700}
.v-done{background:linear-gradient(135deg,var(--g2),var(--g));color:#fff}
.v-done.done{background:linear-gradient(135deg,var(--gd),var(--og));color:#7c4f00}
.v-de-btn{background:rgba(26,40,64,.07);color:var(--dim)}

/* ── NOW PLAYING ── */
#nowBar{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(135deg,var(--g),var(--nv));padding:10px 16px;display:none;align-items:center;gap:10px;z-index:200}
#nowBar.on{display:flex}
#nbTxt{flex:1;font-size:13px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#nbAr{font-size:12px;color:rgba(255,255,255,.65);direction:rtl;font-family:serif}
#nbStop{background:rgba(255,255,255,.2);border:none;border-radius:10px;padding:6px 14px;color:#fff;font-size:14px;font-weight:700;cursor:pointer}

/* ── STAR RAIN ── */
#starRain{position:fixed;inset:0;pointer-events:none;z-index:300;display:none}
.star-drop{position:absolute;top:-30px;font-size:24px;animation:fall linear forwards}
@keyframes fall{to{top:110%;opacity:0}}

/* ── CELEBRATE ── */
#cel{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:400;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px}
#cel.on{display:flex}
#celPts{font-size:72px;font-weight:900;color:var(--gd)}
#celSub{font-size:22px;font-weight:800;color:#fff;margin-bottom:6px}
#celOk{margin-top:20px;padding:14px 40px;border-radius:16px;border:none;cursor:pointer;font-size:17px;font-weight:800;background:var(--gd);color:var(--nv);font-family:inherit}

/* ── INSTALL MODAL ── */
#instModal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:500;display:none;align-items:flex-end;justify-content:center}
#instModal.on{display:flex}
.inst-box{background:#fff;border-radius:28px 28px 0 0;padding:24px 20px 40px;width:100%;max-width:480px}
#instOk,#installBtn{width:100%;padding:14px;border-radius:14px;border:none;cursor:pointer;font-size:16px;font-weight:800;font-family:inherit;background:linear-gradient(135deg,var(--g2),var(--g));color:#fff;margin-top:8px}

/* ── OFFLINE BADGE ── */
#offlineBadge{position:fixed;top:60px;right:10px;background:var(--rd);color:#fff;border-radius:10px;padding:4px 10px;font-size:12px;font-weight:700;display:none;z-index:60}
#offlineBadge.on{display:block}

/* ── USER PANEL ── */
.panel-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:150;align-items:flex-end;justify-content:center}
.panel-bg.on{display:flex}
.panel{background:#fff;border-radius:28px 28px 0 0;padding:22px 18px 40px;width:100%;max-width:480px;max-height:85vh;overflow-y:auto}
.panel-handle{width:40px;height:4px;background:rgba(26,40,64,.15);border-radius:4px;margin:0 auto 18px}
#panelAuth{display:none}
#panelAuth.on{display:block}
#panelUser{display:none}
.panel-role-btns{display:flex;gap:10px;margin-bottom:20px}
.prb{flex:1;padding:16px 10px;border-radius:16px;border:none;cursor:pointer;font-size:15px;font-weight:800;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:4px}
.prb:active{transform:scale(.97)}
.prb.L{background:#e8f7ef;color:var(--g)}
.prb.S{background:#fff8e1;color:#7c4f00}
.prb small{font-size:11px;font-weight:600;opacity:.7}
.p-tabs{display:flex;background:rgba(26,40,64,.06);border-radius:12px;padding:3px;margin-bottom:18px}
.p-tab{flex:1;padding:9px;border:none;border-radius:10px;background:transparent;font-size:14px;font-weight:700;color:var(--dim);cursor:pointer;font-family:inherit}
.p-tab.on{background:#fff;color:var(--g);box-shadow:0 2px 8px rgba(0,0,0,.1)}
.p-fg{margin-bottom:13px}
.p-lbl{font-size:13px;font-weight:700;color:var(--dim);margin-bottom:5px;display:block}
.p-inp{width:100%;padding:13px 15px;border-radius:13px;border:2px solid var(--brd);background:#fff;font-size:16px;font-family:inherit;color:var(--txt);outline:none}
.p-inp:focus{border-color:var(--g)}
.p-btn{width:100%;padding:14px;border-radius:14px;border:none;cursor:pointer;font-size:16px;font-weight:800;font-family:inherit;background:linear-gradient(135deg,var(--g2),var(--g));color:#fff;margin-top:4px}
.aerr{background:#ffeef0;border:2px solid var(--rd);border-radius:11px;padding:11px;font-size:13px;color:var(--rd);margin-bottom:12px;display:none;font-weight:700;line-height:1.4}
.panel-user-info{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--brd);margin-bottom:14px}
.pu-av{width:50px;height:50px;border-radius:15px;background:linear-gradient(135deg,var(--g2),var(--g));color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pu-name{font-size:17px;font-weight:800}
.pu-role{font-size:13px;color:var(--dim);font-weight:600;margin-top:2px}
.p-dash-btn{width:100%;padding:13px;border-radius:14px;border:none;cursor:pointer;font-size:15px;font-weight:800;font-family:inherit;background:linear-gradient(135deg,var(--g2),var(--g));color:#fff;margin-bottom:10px}
.p-out-btn{width:100%;padding:13px;border-radius:14px;border:none;cursor:pointer;font-size:15px;font-weight:800;font-family:inherit;background:rgba(230,57,70,.1);color:var(--rd)}

/* ── DASHBOARD & DETAIL OVERLAYS ── */
#dashOverlay,#detOverlay{display:none;position:fixed;inset:0;background:var(--bg);z-index:160;overflow-y:auto}
#dashOverlay.on{display:block}
#detOverlay{z-index:170}
#detOverlay.on{display:block}
.do-hdr,.det-hdr{background:linear-gradient(135deg,var(--g),var(--nv));padding:50px 16px 16px;position:sticky;top:0;z-index:10;position:relative}
.do-back,#detBack{position:absolute;top:10px;left:12px;width:44px;height:44px;background:rgba(255,255,255,.15);border:none;border-radius:12px;color:#fff;font-size:22px;cursor:pointer}
.do-av{font-size:26px;text-align:center;margin-bottom:4px}
.do-name,#detTitle{font-size:19px;font-weight:800;color:#fff;text-align:center;padding:0 54px}
.do-role,#detSub{font-size:13px;color:rgba(255,255,255,.7);text-align:center;margin-top:3px}
.d-fab{position:fixed;bottom:24px;right:24px;width:56px;height:56px;border-radius:17px;border:none;cursor:pointer;font-size:24px;background:linear-gradient(135deg,var(--g2),var(--g));color:#fff;box-shadow:0 6px 20px rgba(30,110,74,.4);z-index:170}

/* ── DASH CARDS ── */
.d-sec{font-size:12px;font-weight:800;color:var(--dim);text-transform:uppercase;letter-spacing:1.5px;margin:16px 14px 8px}
.d-card{background:#fff;border-radius:16px;margin:0 14px 9px;padding:14px;box-shadow:0 2px 10px rgba(26,40,64,.07);cursor:pointer}
.d-card:active{transform:scale(.98)}
.d-cr{display:flex;align-items:center;gap:11px}
.d-ci{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.d-ci.g{background:linear-gradient(135deg,var(--g2),var(--g))}
.d-ci.gd{background:linear-gradient(135deg,var(--gd),var(--og))}
.d-ci.nv{background:linear-gradient(135deg,#4a7fc1,var(--nv))}
.d-cb{flex:1;min-width:0}
.d-ct{font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d-cs{font-size:12px;color:var(--dim);margin-top:2px}
.d-ca{color:var(--dim);font-size:17px}

/* ── MODALS ── */
.mbg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:220;align-items:flex-end;justify-content:center}
.mbg.on{display:flex}
.modal{background:#fff;border-radius:26px 26px 0 0;padding:20px 16px 40px;width:100%;max-width:480px;max-height:88vh;overflow-y:auto}
.modal h3{font-size:18px;font-weight:800;margin-bottom:16px}
.mc{float:right;background:rgba(0,0,0,.06);border:none;border-radius:50%;width:31px;height:31px;font-size:16px;cursor:pointer;color:var(--dim)}
.pick{display:flex;flex-wrap:wrap;gap:7px;padding:12px 0}
.pi{padding:8px 11px;border-radius:11px;border:2px solid var(--brd);background:#fff;font-size:12px;font-weight:700;cursor:pointer;text-align:center}
.pi.on{border-color:var(--g);background:var(--g);color:#fff}
.pi-ar{font-family:serif;font-size:14px;display:block}
.pi-de{font-size:10px;opacity:.75;display:block;margin-top:1px}

/* ── PROGRESS TABLE ── */
.ptbl{margin:8px 14px;border-radius:14px;overflow:hidden;box-shadow:0 2px 10px rgba(26,40,64,.07)}
.pr{display:flex;align-items:center;background:#fff;padding:12px 14px;border-bottom:1px solid var(--brd);cursor:pointer}
.pr:last-child{border:none}
.pr.hd{background:var(--g);color:#fff;font-size:12px;font-weight:800;cursor:default}
.pn{flex:1;font-size:14px;font-weight:700}
.pv{font-size:13px;font-weight:700;color:var(--dim);text-align:right;min-width:52px}
.pbw{flex:1;margin:0 8px}
.pw{background:#f0f4f8;border-radius:5px;height:7px;overflow:hidden}
.pf{height:100%;background:var(--gd);border-radius:5px;transition:.5s}

/* ── CODE BOX ── */
.codebox{background:linear-gradient(135deg,var(--g),var(--nv));border-radius:18px;padding:20px;text-align:center;margin:12px 14px}
.codelbl{font-size:12px;color:rgba(255,255,255,.7);margin-bottom:7px;font-weight:700}
.codeval{font-size:38px;font-weight:900;color:var(--gd);letter-spacing:7px}
.codehint{font-size:11px;color:rgba(255,255,255,.6);margin-top:5px}
.dlb{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:16px;font-size:12px;font-weight:700}
.dlb.ok{background:#e8f7ef;color:var(--g)}
.dlb.warn{background:#fff8e1;color:#b8860b}
.dlb.over{background:#ffeef0;color:var(--rd)}

/* ── HW CARDS ── */
.hw-card{background:#fff;border-radius:14px;margin:7px 14px;padding:13px;box-shadow:0 2px 9px rgba(26,40,64,.06)}
.hw-hdr{display:flex;align-items:center;gap:10px}
.hw-num{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--gd),var(--og));color:#fff;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.hw-ar{font-family:serif;font-size:19px;color:var(--g);direction:rtl;font-weight:700}
.hw-de{font-size:11px;color:var(--dim);font-weight:600;margin-top:2px}
.hw-btn{margin-top:10px;width:100%;padding:10px;border-radius:12px;border:none;cursor:pointer;font-size:14px;font-weight:800;font-family:inherit;background:linear-gradient(135deg,var(--g2),var(--g));color:#fff}
.hw-btn.done{background:linear-gradient(135deg,var(--gd),var(--og));color:#7c4f00}
.badge-g{display:inline-block;padding:2px 8px;border-radius:15px;font-size:11px;font-weight:700;background:#e8f7ef;color:var(--g);margin-left:6px}
.ecard{background:#fff;border-radius:14px;margin:7px 14px;padding:13px;box-shadow:0 2px 9px rgba(26,40,64,.06)}
.erow{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--brd)}
.erow:last-child{border:none}
.edot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.edot.empty{background:#d0dce4}.edot.done{background:var(--g2)}.edot.conf{background:var(--gd)}
.ear{font-family:serif;font-size:17px;color:var(--g);direction:rtl;font-weight:700;flex:1}
.ede{font-size:11px;color:var(--dim);font-weight:600}
.cbtn{height:32px;padding:0 11px;border-radius:15px;border:none;cursor:pointer;font-size:12px;font-weight:800;font-family:inherit;background:linear-gradient(135deg,var(--g2),var(--g));color:#fff;flex-shrink:0}
.cbtn.conf{background:var(--gd);color:#7c4f00}
.cbtn:disabled{opacity:.35;cursor:default}

/* ── LOADER / EMPTY ── */
.dldr{display:flex;flex-direction:column;align-items:center;justify-content:center;height:180px;color:var(--dim);gap:11px}
.spin{width:32px;height:32px;border:4px solid var(--brd);border-top-color:var(--g);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.dempty{text-align:center;padding:40px 20px;color:var(--dim)}
.dei{font-size:48px;margin-bottom:10px}
.dempty h3{font-size:16px;font-weight:800;color:var(--txt);margin-bottom:5px}
.sp{height:80px}
#dtoast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1a2840;color:#fff;padding:10px 18px;border-radius:16px;font-size:14px;font-weight:700;z-index:999;opacity:0;transition:.3s;white-space:nowrap;pointer-events:none}
#dtoast.on{opacity:1}

</style>
</head>
<body>


<div id="offlineBadge">&#x26A0; Offline</div>
<div id="starRain"></div>

<!-- HEADER -->
<header class="hdr">
  <button class="user-btn" id="userBtn" onclick="openUserPanel()">👤</button>
  <div class="stars-badge"><span id="starsBadge">0</span></div>
  <div class="hdr-mid">
    <div class="hdr-title">Juz Amma</div>
    <div class="hdr-title-ar">جزء عمّ</div>
  </div>
  <div style="width:84px"></div>
</header>

<!-- MAIN -->
<div class="main">
  <div id="totalProg">0 von 571 Versen</div>
  <div id="surahGrid"></div>
</div>

<!-- NOW PLAYING -->
<div id="nowBar">
  <div style="flex:1"><div id="nbTxt">Wird gespielt...</div><div id="nbAr"></div></div>
  <button id="nbStop">&#x25FC; Stop</button>
</div>

<!-- SURAH VIEW -->
<div class="sv" id="sv">
  <div class="sv-hdr" style="position:relative">
    <button id="backBtn">&#x2190;</button>
    <div id="svAr"></div>
    <div id="svDe"></div>
    <div class="sv-prog-row">
      <span id="svProg">0 von 0</span>
      <div class="sv-pb"><div id="svFill"></div></div>
      <span id="svStars">⭐</span>
    </div>
    <div class="ctrl">
      <button class="ctrl-btn" id="playBtn">&#x25B6;</button>
      <div class="range-row">
